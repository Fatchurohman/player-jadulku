<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>fatur62 Luxury Music Player</title>
  <style>
    /* VARIABLES & THEMES */
    :root {
      /* Dark Theme (Default) */
      --body-bg: linear-gradient(135deg, #090a0f 0%, #171923 100%);
      --player-bg: rgba(15, 23, 42, 0.92);
      --player-border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --btn-bg: rgba(255, 255, 255, 0.06);
      --btn-border: rgba(255, 255, 255, 0.12);
      --accent-color: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.4);
      --progress-bg: rgba(255, 255, 255, 0.08);
      --shadow-color: rgba(0, 0, 0, 0.7);
    }

    [data-theme="light"] {
      /* Light Theme */
      --body-bg: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
      --player-bg: rgba(255, 255, 255, 0.88);
      --player-border: rgba(255, 255, 255, 0.6);
      --text-main: #0f172a;
      --text-sub: #64748b;
      --btn-bg: rgba(0, 0, 0, 0.04);
      --btn-border: rgba(0, 0, 0, 0.08);
      --accent-color: #0284c7;
      --accent-glow: rgba(2, 132, 199, 0.3);
      --progress-bg: rgba(0, 0, 0, 0.08);
      --shadow-color: rgba(148, 163, 184, 0.4);
    }

    /* RESET & BASE STYLES */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: var(--body-bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      transition: background 0.4s ease;
    }

    /* CONTAINER 9:16 LUXURY GLASSMORPHISM */
    .player-wrapper {
      position: relative;
      width: 100%;
      max-width: 414px;
      height: 100vh;
      max-height: 896px;
      aspect-ratio: 9 / 16;
      background: var(--player-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 20px 32px 20px;
      box-shadow: 0 25px 50px -12px var(--shadow-color), 0 0 30px var(--accent-glow);
      overflow: hidden;
      border: 1px solid var(--player-border);
      transition: all 0.4s ease;
    }

    @media (min-height: 900px) and (min-width: 500px) {
      .player-wrapper {
        border-radius: 36px;
        height: calc(100vh - 40px);
      }
    }

    /* HEADER & BRANDING */
    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
    }

    .brand-tag {
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--accent-color);
      text-transform: uppercase;
      text-shadow: 0 0 10px var(--accent-glow);
    }

    .header-title {
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-sub);
      font-weight: 600;
    }

    .icon-btn {
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--text-main);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .icon-btn:hover {
      border-color: var(--accent-color);
      color: var(--accent-color);
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    /* ARTWORK & GLOW EFFECT */
    .artwork-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 10px 0;
      z-index: 2;
      position: relative;
    }

    .album-art-wrapper {
      position: relative;
      width: 100%;
      max-width: 260px;
      aspect-ratio: 1 / 1;
    }

    .album-art-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 24px;
      background: var(--accent-color);
      filter: blur(25px);
      opacity: 0.3;
      transition: opacity 0.3s ease;
    }

    .player-wrapper.playing .album-art-bg {
      opacity: 0.6;
      animation: pulseGlow 3s infinite alternate;
    }

    @keyframes pulseGlow {
      0% { filter: blur(20px); opacity: 0.4; }
      100% { filter: blur(35px); opacity: 0.7; }
    }

    .album-art-placeholder {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 24px;
      background: var(--btn-bg);
      border: 1px solid var(--player-border);
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 15px 35px var(--shadow-color);
      overflow: hidden;
    }

    .album-art-placeholder svg {
      width: 64px;
      height: 64px;
      fill: var(--text-sub);
      transition: fill 0.3s ease;
    }

    .player-wrapper.playing .album-art-placeholder svg {
      fill: var(--accent-color);
    }

    /* VISUALIZER ANIMATION */
    .visualizer {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 24px;
      margin-top: 16px;
    }

    .bar {
      width: 4px;
      height: 6px;
      background: var(--accent-color);
      border-radius: 2px;
      transition: height 0.2s ease;
    }

    .player-wrapper.playing .bar {
      animation: bounce 1.2s infinite ease-in-out alternate;
    }

    .player-wrapper.playing .bar:nth-child(1) { animation-delay: 0.1s; }
    .player-wrapper.playing .bar:nth-child(2) { animation-delay: 0.4s; }
    .player-wrapper.playing .bar:nth-child(3) { animation-delay: 0.2s; }
    .player-wrapper.playing .bar:nth-child(4) { animation-delay: 0.5s; }
    .player-wrapper.playing .bar:nth-child(5) { animation-delay: 0.3s; }

    @keyframes bounce {
      0% { height: 4px; }
      100% { height: 24px; }
    }

    /* TRACK INFO */
    .track-info {
      text-align: center;
      margin-bottom: 12px;
      z-index: 2;
    }

    .track-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .track-artist {
      font-size: 0.9rem;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ACTION BUTTON (OPEN FILE) */
    .file-upload-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 16px;
      z-index: 2;
    }

    .btn-open-file {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--btn-bg);
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-open-file:hover {
      background: var(--accent-color);
      color: #ffffff;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* PROGRESS BAR */
    .progress-container {
      width: 100%;
      margin-bottom: 20px;
      z-index: 2;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: var(--progress-bg);
      border-radius: 3px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: var(--accent-color);
      border-radius: 3px;
      box-shadow: 0 0 8px var(--accent-glow);
    }

    .time-stamps {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-top: 8px;
      font-weight: 500;
    }

    /* CONTROLS */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
      padding: 0 4px;
    }

    .play-btn {
      width: 64px;
      height: 64px;
      background: var(--accent-color);
      color: #ffffff;
      border: none;
      border-radius: 50%;
      box-shadow: 0 8px 25px var(--accent-glow);
    }

    .play-btn:hover {
      transform: scale(1.05);
    }

    .svg-icon {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .play-btn .svg-icon {
      width: 26px;
      height: 26px;
    }

    .active-mode {
      color: var(--accent-color) !important;
      border-color: var(--accent-color) !important;
      background: var(--btn-bg) !important;
    }

    #fileInput {
      display: none;
    }
  </style>
</head>
<body>

  <div class="player-wrapper" id="playerApp">
    <!-- HEADER -->
    <header class="player-header">
      <div class="brand-tag">fatur62</div>
      <span class="header-title">NOW PLAYING</span>
      <button class="icon-btn" id="themeToggleBtn" aria-label="Toggle Theme">
        <svg class="svg-icon" id="themeIcon" viewBox="0 0 24 24">
          <!-- Sun Icon (Light Mode Target) -->
          <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>
        </svg>
      </button>
    </header>

    <!-- ARTWORK -->
    <main class="artwork-container">
      <div class="album-art-wrapper">
        <div class="album-art-bg"></div>
        <div class="album-art-placeholder">
          <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        </div>
      </div>
      <div class="visualizer">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
    </main>

    <!-- TRACK DETAILS -->
    <section class="track-info">
      <h1 id="trackTitle" class="track-title">Belum ada lagu</h1>
      <p id="trackArtist" class="track-artist">Silakan buka file lokal</p>
    </section>

    <!-- ACTION BUTTON: BUKA FOLDER/FILE -->
    <div class="file-upload-wrapper">
      <label for="fileInput" class="btn-open-file">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/></svg>
        <span>Buka Folder / File Audio</span>
      </label>
      <input type="file" id="fileInput" accept="audio/*" multiple />
    </div>

    <!-- PROGRESS AREA -->
    <section class="progress-container">
      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="time-stamps">
        <span id="currentTime">0:00</span>
        <span id="durationTime">0:00</span>
      </div>
    </section>

    <!-- CONTROLS -->
    <footer class="controls">
      <button class="icon-btn" id="shuffleBtn" aria-label="Shuffle">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.45 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
      </button>

      <button class="icon-btn" id="prevBtn" aria-label="Previous">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>

      <button class="icon-btn play-btn" id="playBtn" aria-label="Play/Pause">
        <svg class="svg-icon" id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>

      <button class="icon-btn" id="nextBtn" aria-label="Next">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>

      <button class="icon-btn" id="repeatBtn" aria-label="Repeat">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
      </button>
    </footer>
  </div>

  <script>
    class LuxuryAudioPlayer {
      constructor() {
        this.playlist = [];
        this.currentIndex = 0;
        this.isPlaying = false;
        this.isShuffle = false;
        this.isRepeat = false;
        this.isLightMode = false;

        this.audio = new Audio();

        // DOM Elements
        this.playerWrapper = document.getElementById('playerApp');
        this.fileInput = document.getElementById('fileInput');
        this.playBtn = document.getElementById('playBtn');
        this.playIcon = document.getElementById('playIcon');
        this.prevBtn = document.getElementById('prevBtn');
        this.nextBtn = document.getElementById('nextBtn');
        this.shuffleBtn = document.getElementById('shuffleBtn');
        this.repeatBtn = document.getElementById('repeatBtn');
        this.themeToggleBtn = document.getElementById('themeToggleBtn');
        this.themeIcon = document.getElementById('themeIcon');

        this.trackTitle = document.getElementById('trackTitle');
        this.trackArtist = document.getElementById('trackArtist');

        this.progressBar = document.getElementById('progressBar');
        this.progressFill = document.getElementById('progressFill');
        this.currentTimeEl = document.getElementById('currentTime');
        this.durationTimeEl = document.getElementById('durationTime');

        this.init();
      }

      init() {
        this.bindEvents();
      }

      bindEvents() {
        // Theme Toggle Handler
        this.themeToggleBtn.addEventListener('click', () => this.toggleTheme());

        // File Input Handler
        this.fileInput.addEventListener('change', (e) => this.handleFileSelection(e));

        // Player Controls
        this.playBtn.addEventListener('click', () => this.togglePlay());
        this.nextBtn.addEventListener('click', () => this.nextTrack());
        this.prevBtn.addEventListener('click', () => this.prevTrack());

        this.shuffleBtn.addEventListener('click', () => {
          this.isShuffle = !this.isShuffle;
          this.shuffleBtn.classList.toggle('active-mode', this.isShuffle);
        });

        this.repeatBtn.addEventListener('click', () => {
          this.isRepeat = !this.isRepeat;
          this.repeatBtn.classList.toggle('active-mode', this.isRepeat);
        });

        // Audio Listeners
        this.audio.addEventListener('loadedmetadata', () => {
          this.durationTimeEl.textContent = this.formatTime(this.audio.duration);
        });

        this.audio.addEventListener('timeupdate', () => {
          if (this.audio.duration) {
            const percent = (this.audio.currentTime / this.audio.duration) * 100;
            this.progressFill.style.width = `${percent}%`;
            this.currentTimeEl.textContent = this.formatTime(this.audio.currentTime);
          }
        });

        this.audio.addEventListener('ended', () => {
          if (this.isRepeat) {
            this.audio.currentTime = 0;
            this.play();
          } else {
            this.nextTrack();
          }
        });

        // Progress Seek Bar
        this.progressBar.addEventListener('click', (e) => {
          if (!this.audio.duration) return;
          const rect = this.progressBar.getBoundingClientRect();
          const clickX = e.clientX - rect.left;
          this.audio.currentTime = (clickX / rect.width) * this.audio.duration;
        });
      }

      toggleTheme() {
        this.isLightMode = !this.isLightMode;
        if (this.isLightMode) {
          document.documentElement.setAttribute('data-theme', 'light');
          // Icon Moon
          this.themeIcon.innerHTML = '<path d="M12.3 2c.43 0 .77.35.75.78-.29 5.08 3.76 9.13 8.84 8.84.43-.02.78.32.78.75-.27 4.86-4.22 8.8-9.08 9.07-5.4.3-9.83-3.96-9.83-9.33 0-4.86 3.94-8.81 8.8-9.08.25-.02.5-.03.74-.03z"/>';
        } else {
          document.documentElement.removeAttribute('data-theme');
          // Icon Sun
          this.themeIcon.innerHTML = '<path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>';
        }
      }

      handleFileSelection(e) {
        const files = Array.from(e.target.files);
        if (!files.length) return;

        this.playlist = files.map(file => ({
          title: file.name.replace(/\.[^/.]+$/, ""),
          artist: "File Lokal",
          url: URL.createObjectURL(file)
        }));

        this.currentIndex = 0;
        this.loadTrack(this.currentIndex);
        this.play();
      }

      loadTrack(index) {
        const track = this.playlist[index];
        if (!track) return;

        this.trackTitle.textContent = track.title;
        this.trackArtist.textContent = track.artist;
        this.audio.src = track.url;

        this.progressFill.style.width = '0%';
        this.currentTimeEl.textContent = '0:00';
        this.durationTimeEl.textContent = '0:00';
      }

      togglePlay() {
        if (!this.playlist.length) return;
        if (this.isPlaying) {
          this.pause();
        } else {
          this.play();
        }
      }

      play() {
        if (!this.audio.src) return;
        this.audio.play().then(() => {
          this.isPlaying = true;
          this.playerWrapper.classList.add('playing');
          this.playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        }).catch(err => console.error('Playback error:', err));
      }

      pause() {
        this.audio.pause();
        this.isPlaying = false;
        this.playerWrapper.classList.remove('playing');
        this.playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      }

      nextTrack() {
        if (!this.playlist.length) return;
        if (this.isShuffle) {
          this.currentIndex = Math.floor(Math.random() * this.playlist.length);
        } else {
          this.currentIndex = (this.currentIndex + 1) % this.playlist.length;
        }
        this.loadTrack(this.currentIndex);
        this.play();
      }

      prevTrack() {
        if (!this.playlist.length) return;
        this.currentIndex = (this.currentIndex - 1 + this.playlist.length) % this.playlist.length;
        this.loadTrack(this.currentIndex);
        this.play();
      }

      formatTime(seconds) {
        if (isNaN(seconds)) return '0:00';
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      new LuxuryAudioPlayer();
    });
  </script>
</body>
</html>
