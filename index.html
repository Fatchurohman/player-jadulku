<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Player 9:16 Responsive</title>
  <style>
    /* RESET & BASE STYLES */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #0d0f12;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* CONTAINER 9:16 RESPONSIVE */
    .player-wrapper {
      position: relative;
      width: 100%;
      max-width: 414px; /* Lebar standar viewport hp */
      height: 100vh;
      max-height: 896px;
      aspect-ratio: 9 / 16;
      background: linear-gradient(180deg, #1f242d 0%, #090a0f 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 20px 32px 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      overflow: hidden;
    }

    @media (min-height: 900px) and (min-width: 500px) {
      .player-wrapper {
        border-radius: 32px;
        height: calc(100vh - 40px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
    }

    /* HEADER */
    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: #ffffff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .icon-btn:active {
      transform: scale(0.95);
      background: rgba(255, 255, 255, 0.15);
    }

    .header-title {
      font-size: 0.85rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #a0a5b5;
      font-weight: 600;
    }

    /* ARTWORK */
    .artwork-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 0;
      z-index: 2;
    }

    .album-art {
      width: 100%;
      max-width: 280px;
      aspect-ratio: 1 / 1;
      border-radius: 20px;
      object-fit: cover;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s ease;
    }

    .player-wrapper.playing .album-art {
      transform: scale(1.02);
    }

    /* INFO TRACK */
    .track-info {
      text-align: center;
      margin-bottom: 16px;
      z-index: 2;
    }

    .track-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 6px;
    }

    .track-artist {
      font-size: 0.95rem;
      color: #8f96a3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* PROGRESS BAR */
    .progress-container {
      width: 100%;
      margin-bottom: 24px;
      z-index: 2;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 3px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: #3b82f6;
      border-radius: 3px;
      transition: width 0.1s linear;
    }

    .time-stamps {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #717784;
      margin-top: 8px;
    }

    /* CONTROLS */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
      padding: 0 10px;
    }

    .play-btn {
      width: 64px;
      height: 64px;
      background: #3b82f6;
      color: #ffffff;
      border-radius: 50%;
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
    }

    .play-btn:active {
      background: #2563eb;
    }

    .svg-icon {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .play-btn .svg-icon {
      width: 26px;
      height: 26px;
    }
  </style>
</head>
<body>

  <div class="player-wrapper" id="playerApp">
    <!-- HEADER -->
    <header class="player-header">
      <button class="icon-btn" aria-label="Minimize">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
      </button>
      <span class="header-title">Now Playing</span>
      <button class="icon-btn" aria-label="Playlist">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
      </button>
    </header>

    <!-- ARTWORK -->
    <main class="artwork-container">
      <img id="albumArt" class="album-art" src="https://via.placeholder.com/300/1f242d/ffffff?text=No+Cover" alt="Album Art" />
    </main>

    <!-- TRACK DETAILS -->
    <section class="track-info">
      <h1 id="trackTitle" class="track-title">Judul Lagu</h1>
      <p id="trackArtist" class="track-artist">Nama Penyanyi</p>
    </section>

    <!-- PROGRESS AREA -->
    <section class="progress-container">
      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="time-stamps">
        <span id="currentTime">0:00</span>
        <span id="durationTime">0:00</span>
      </div>
    </section>

    <!-- CONTROLS -->
    <footer class="controls">
      <button class="icon-btn" id="shuffleBtn" aria-label="Shuffle">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.45 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
      </button>

      <button class="icon-btn" id="prevBtn" aria-label="Previous">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>

      <button class="icon-btn play-btn" id="playBtn" aria-label="Play/Pause">
        <svg class="svg-icon" id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>

      <button class="icon-btn" id="nextBtn" aria-label="Next">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>

      <button class="icon-btn" id="repeatBtn" aria-label="Repeat">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
      </button>
    </footer>
  </div>

</body>
</html>
